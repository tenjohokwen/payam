apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    url: http://loki:3100

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      lokiSearch:
        datasourceUid: 'Loki'
      serviceMap:
        datasourceUid: 'Prometheus'
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        limit: 20
      tracesToLogs:
        datasourceUid: 'Loki'
        tags: ['application']
        mappedTags: [{ key: 'service.name', value: 'application' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceId: true
        filterBySpanId: false
      tracesToMetrics:
        datasourceUid: 'Prometheus'
        tags: [{ key: 'service.name', value: 'application' }]
        queries:
          - name: 'Request Rate'
            query: 'rate(http_server_requests_seconds_count{application="$${__tags[\"service.name\"]}"}[5m])'
