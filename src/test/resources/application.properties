# Test-time Orange token URL: derives from base-url so WireMock override propagates to token endpoint.
# orange.base-url is overridden by @ConfigureWireMock(baseUrlProperties) to http://localhost:{port}.
orange.token-url=${orange.base-url}/token

# Test-time circuit breaker tuning: large sliding window prevents premature circuit opening
# Test-time Orange circuit breaker tuning: avoid large sliding window so IT tests trip fast
resilience4j.circuitbreaker.instances.orange.slidingWindowSize=5
resilience4j.circuitbreaker.instances.orange.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orange.minimumNumberOfCalls=5

# Test-time MTN token URL: derives from collection-base-url so WireMock override propagates to token endpoint.
# mtn.collection-base-url is overridden by @ConfigureWireMock(baseUrlProperties) to http://localhost:{port}.
# Following the 03-02 decision pattern for Orange.
mtn.collection-token-url=${mtn.collection-base-url}/token/

# Test-time MTN circuit breaker tuning: same pattern as Orange
resilience4j.circuitbreaker.instances.mtn.slidingWindowSize=5
resilience4j.circuitbreaker.instances.mtn.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mtn.minimumNumberOfCalls=5

# Phase 42: pinCryptopher @Bean (PlatformConfig @Configuration) requires a non-blank
# secret at context startup; otherwise Cryptopher constructor throws EncryptionException
# (MISSING_SECRET) and every IT fails with BeanCreationException for 'pinCryptopher'.
# Value is intentionally arbitrary — IT tests do not verify ciphertext bytes, only round-trip.
payam.platform.pin-encryption-secret=test-pin-secret-for-tests
